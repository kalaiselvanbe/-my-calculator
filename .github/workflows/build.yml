import ast
import ctypes
import dis
import inspect
import textwrap
from typing import Callable, Any

# 1. AST TRANSFORMER: Modifies Python syntax trees before bytecode compilation
class FunctionCallInterceptor(ast.NodeTransformer):
    """Rewrites every function call inside a target function to route through a proxy."""
    
    def visit_Call(self, node: ast.Call) -> ast.AST:
        self.generic_visit(node)
        
        # Wraps existing call: original_func(*args) -> _audit_proxy("original_func", original_func, *args)
        func_name = ast.unparse(node.func)
        return ast.Call(
            func=ast.Name(id="_audit_proxy", ctx=ast.Load()),
            args=[ast.Constant(value=func_name), node.func, *node.args],
            keywords=node.keywords,
        )

# 2. METAPROGRAMMING DECORATOR: Decompiles, mutates AST, and recompiles at runtime
def hijack_ast(func: Callable[..., Any]) -> Callable[..., Any]:
    source = textwrap.dedent(inspect.getsource(func))
    tree = ast.parse(source)
    
    # Strip the '@hijack_ast' decorator so it doesn't infinitely recurse upon recompilation
    func_def = tree.body[0]
    if isinstance(func_def, ast.FunctionDef):
        func_def.decorator_list = []

    # Mutate the syntax tree and fix missing line numbers required by the compiler
    mutated_tree = FunctionCallInterceptor().visit(tree)
    ast.fix_missing_locations(mutated_tree)

    # Compile mutated AST into a raw Python code object
    compiled_code = compile(mutated_tree, filename="<ast-hijacked>", mode="exec")

    # Inject our runtime interceptor into the function's execution namespace
    def _audit_proxy(name: str, target: Callable[..., Any], *args: Any, **kwargs: Any) -> Any:
        print(f"[AST HOOK] Intercepted call -> '{name}' with payload: {args}")
        return target(*args, **kwargs)

    namespace = {**func.__globals__, "_audit_proxy": _audit_proxy}
    exec(compiled_code, namespace)
    return namespace[func.__name__]

# 3. C-LEVEL MEMORY INSPECTOR: Reads raw CPython PyObject struct headers via ctypes
class PyObjectHeader(ctypes.Structure):
    _fields_ = [
        ("ob_refcnt", ctypes.c_ssize_t),
        ("ob_type", ctypes.c_void_p),
    ]

def inspect_raw_memory(obj: Any) -> None:
    address = id(obj)
    raw_struct = PyObjectHeader.from_address(address)
    print(f"[C-MEMORY] Address: {hex(address)} | CPython RefCount: {raw_struct.ob_refcnt}")

# 4. TARGET PAYLOAD (Written as completely normal Python)
@hijack_ast
def execute_secure_workflow(user: str, role: str) -> str:
    cleaned_user = user.strip().upper()
    badge = f"[{role}:{cleaned_user}]"
    return badge

if __name__ == "__main__":
    result = execute_secure_workflow("  alice  ", "admin")
    print("Final Output:", result)
    
    print("\n--- Under the Hood ---")
    inspect_raw_memory(result)
    
    print("\n--- Rewritten CPython Bytecode ---")
    dis.dis(execute_secure_workflow)
