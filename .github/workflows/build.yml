name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build Executable
      run: pyinstaller --onefile --windowed --name SuperCalculator calculator.py

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: SuperCalculator-Windows
        path: dist/SuperCalculator.exe
